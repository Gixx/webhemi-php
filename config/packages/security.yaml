security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # Admin UI + protected /admin/api (separate security context from frontend).
        admin:
            pattern: ^/admin
            lazy: true
            provider: app_user_provider
            context: admin
            form_login:
                login_path: admin_login
                check_path: admin_login
                enable_csrf: true
                username_parameter: email
                password_parameter: password
                default_target_path: admin_dashboard
            json_login:
                check_path: api_admin_login
                username_path: email
                password_path: password
            logout:
                path: admin_logout
                target: admin_login

        # Public site surface (frontend login/register reserved paths).
        frontend:
            pattern: ^/
            lazy: true
            provider: app_user_provider
            context: frontend
            form_login:
                login_path: frontend_login
                check_path: frontend_login
                enable_csrf: true
                csrf_token_id: frontend_authenticate
                username_parameter: email
                password_parameter: password
                default_target_path: site_home
            logout:
                path: frontend_logout
                target: frontend_login

    access_control:
        - { path: ^/admin/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin/logout, roles: PUBLIC_ACCESS }
        - { path: ^/admin/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_USER }
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/logout, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
