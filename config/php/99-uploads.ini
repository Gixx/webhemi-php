; Local / CLI overrides for media library uploads (video, large images).
; Prefer the project-root `php.ini` (used automatically by `symfony serve`).
;
; Optional: symlink or copy into PHP's conf.d, or start PHP with:
;   PHP_INI_SCAN_DIR=":/path/to/webhemi-php/config/php" php ...
;   php -c config/php/99-uploads.ini -S 127.0.0.1:8000 -t public
;
; post_max_size must be >= upload_max_filesize.

upload_max_filesize = 64M
post_max_size = 64M
